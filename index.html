<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/index.css">

    <!-- <script src="./script/modal.js" defer></script> -->
    <script type="module" src="./script/index.js"></script>

    <title>Expenses App</title>
</head>
<body>

<div class="wrapper">
    <h1>Expenses tracking</h1>

    <div class="expenses">
        <div class="expensesInput">
            <div class="moneyInput rub">
                <input 
                    class="js-expense-input moneyInput__input" 
                    type="number"
                    min="1"
                    />
            </div>

            <select class="js-category-select category-select">
                <option 
                    hidden 
                    disabled 
                    selected 
                    value="Choose the category"
                    >
                    Choose the category
                </option>
                <option value="Products">Products</option>
                <option value="Cafe-restaurant">Cafe and restaurant</option>
                <option value="Apartment">Apartment</option>
                <option value="Car">Car</option>
            </select>
        </div>

        <button class="js-expense-button add-button"> Add Expense</button>

        <div class="stats">
            <div class="stats__limit">
                <span class="label">Limit:</span>
                <span class="js-limit rub">100</span>
                <button class="js-button-change-limit button-change-limit">
                    <img 
                    src="./img/button-change-limit.svg"
                    alt="icon button change limit">
                </button>
            </div>
            <div class="stats__sum">
                <span class="label">Summ:</span>
                <span class="js-sum rub">1350</span>
            </div>
            <div class="stats__status">
                <span class="label">Status:</span>
                <span class="js-status">All is GOOD</span>
            </div>

            <button class="js-clear-button clear-button">Reset expenses</button>
        </div>

        <div class="history">
            <p class="history__title label">History</p>
            <ol class="js-history-list history-list"></ol>
        </div>

        
    </div>
</div>

<div class="modal js-modal" aria-hidden="true">
  <div class="modal__backdrop js-modal-close"></div>

  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal__close js-modal-close" type="button" aria-label="Close">×</button>

    <h2 class="modal__title" id="modalTitle">New limit</h2>

    <div class="modal__content">
      <div class="modal__row">
        <div class="expense-input modal__input rub">
          <input 
            class="js-limit-input" 
            type="number" 
            min="1" 
            placeholder="Enter limit"
          />
        </div>

        <button class="btn-primary js-limit-save" type="button">Set limit</button>
      </div>
    </div>
  </div>
</div>



</body>
</html>
