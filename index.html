<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses App</title>

    <link rel="stylesheet" href="reset.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="wrapper">
    <h1>Expenses tracking</h1>

    <div class="expenses">
        <div class="expensesInput">
            <div class="moneyInput rub">
                <input 
                    class="js-expense-input moneyInput__input" 
                    type="number"
                    min="1"
                    />
            </div>
        </div>

        <button class="js-expense-button addButton"> Add Expense</button>

        <div class="stats">
            <div class="stats__limit">
                <span class="label">Limit:</span>
                <span class="js-limit rub">100</span>
            </div>
            <div class="stats__sum">
                <span class="label">Summ:</span>
                <span class="js-sum rub">1350</span>
            </div>
            <div class="stats__status">
                <span class="label">Status:</span>
                <span class="js-status">All is GOOD</span>
            </div>
        </div>

        <div class="history">
            <div class="history__title label">History</div>
            <ol class="history__list">
                <li class="rub">100</li>
                <li class="rub">100</li>
                <li class="rub">100</li>
                <li class="rub">100</li>
            </ol>
        </div>

    </div>
</div>

<script src="index.js"></script>
</body>
</html>
